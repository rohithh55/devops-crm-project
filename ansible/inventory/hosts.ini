# Inventory for Twenty CRM deployment
# Replace the IP / connection details with your playground VM's info.
#
# For KillerCoda / KodeKloud / SadServers you are usually already root on
# the box, so you can also just run the playbook with `-c local` against
# "localhost" instead of SSH. Both options are shown below — keep the one
# that matches your lab.

[twenty_crm]
crm-server ansible_host=YOUR_SERVER_IP ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa ansible_python_interpreter=/usr/bin/python3

# --- Uncomment this instead if running the playbook ON the playground box itself ---
# [twenty_crm]
# crm-server ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[twenty_crm:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
